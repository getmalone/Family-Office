[project]
name = "family-office"
version = "0.1.18"
description = """
A Family Office agentic AI system — a production-ready multi-agent platform
for autonomous wealth management, tax optimization, accounting, compliance, and
estate planning.
"""
requires-python = ">=3.12"
dependencies = [
    # Pin to the 0.115 line the app was built against: FastAPI >=0.116 pulls
    # Starlette 1.x, which removed the legacy TemplateResponse(name, context)
    # signature used throughout the route handlers.
    "fastapi>=0.115,<0.116",
    "starlette<0.42",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langgraph>=0.3",
    "langgraph-supervisor>=0.0.7",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "pandas>=2.2",
    "numpy>=2.0",
    # Floor at 1.5.2: Yahoo's mid-2026 endpoint changes broke older clients —
    # wholesale "possibly delisted; no price data found" for every valid ticker.
    # The floor forces stale installs forward on their next `uv sync`.
    "yfinance>=1.5.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # Cap below 49: cryptography 49 dropped x86_64 macOS wheels (arm64-only),
    # which would force a from-source build on Intel Macs. 48.x ships wheels for
    # every target (Intel/ARM macOS, Windows, Linux) — keeps installs compiler-free.
    "cryptography>=44.0,<49",
    "sse-starlette>=2.0",
    # Renders the in-app Help page (USAGE.md). Pure-Python, universal wheel.
    "markdown>=3.5",
    # SQLCipher (AES-256 encryption at rest). Prebuilt, cross-platform wheels
    # so installs need no compiler or system libsqlcipher. Activated when
    # KFO_DB_PASSPHRASE is set; see app/services/db.py.
    "sqlcipher3-wheels>=0.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
