[project]
name = "family-office"
version = "0.1.0"
description = """
A Family Office agentic AI system — a production-ready multi-agent platform
for autonomous wealth management, tax optimization, accounting, compliance, and
estate planning.
"""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langgraph>=0.3",
    "langgraph-supervisor>=0.0.7",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "cryptography>=44.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
