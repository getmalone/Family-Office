# Alembic configuration for the Family Office app.
# The database URL/engine is built in alembic/env.py via app.services.db so that
# SQLCipher-encrypted databases are opened with the PRAGMA key.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Placeholder; the real engine is constructed in env.py.
sqlalchemy.url = sqlite:///data/family_office.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
