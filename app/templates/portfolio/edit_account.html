{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit Account</h2>

    <form method="POST" action="/portfolio/accounts/update/{{ account.id }}" class="bg-white shadow rounded-lg p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Account Name</label>
            <input type="text" name="name" required value="{{ account.name }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Account Type</label>
                <select name="account_type" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
                    {% for value, label in account_types %}
                    <option value="{{ value }}" {% if account.account_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Institution</label>
                <input type="text" name="institution" value="{{ account.institution or '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Primary Owner</label>
                <select name="primary_owner_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
                    <option value="">-- None --</option>
                    {% for m in members %}
                    <option value="{{ m.id }}" {% if account.primary_owner_id == m.id %}selected{% endif %}>{{ m.first_name }} {{ m.last_name }} ({{ m.relationship }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Tax Entity</label>
                <select name="tax_entity_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
                    <option value="">-- None --</option>
                    {% for e in entities %}
                    <option value="{{ e.id }}" {% if account.tax_entity_id == e.id %}selected{% endif %}>{{ e.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <input type="checkbox" name="is_taxable" value="true" {% if account.is_taxable %}checked{% endif %} class="rounded border-gray-300">
            Taxable Account
        </label>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 text-white rounded-md px-6 py-2 text-sm font-medium hover:bg-blue-700">Save Changes</button>
            <a href="/portfolio/accounts" class="text-gray-600 rounded-md px-6 py-2 text-sm hover:text-gray-900">Cancel</a>
        </div>
    </form>

    {% if account.is_active %}
    <div class="mt-6 bg-white shadow rounded-lg p-6">
        <h3 class="text-lg font-medium text-red-700 mb-2">Deactivate Account</h3>
        <p class="text-sm text-gray-500 mb-4">This will hide the account from active views. Positions will be preserved.</p>
        <form method="POST" action="/portfolio/accounts/delete/{{ account.id }}"
              onsubmit="return confirm('Deactivate {{ account.name }}?');">
            <button type="submit" class="bg-red-600 text-white rounded-md px-6 py-2 text-sm font-medium hover:bg-red-700">Deactivate Account</button>
        </form>
    </div>
    {% endif %}
</div>
{% endblock %}
