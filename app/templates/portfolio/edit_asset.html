{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit Asset</h2>

    <form method="POST" action="/portfolio/assets/update/{{ asset.id }}" class="bg-white shadow rounded-lg p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Symbol / Ticker</label>
                <input type="text" name="symbol" value="{{ asset.symbol or '' }}" placeholder="Blank for private assets"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" required value="{{ asset.name }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Asset Class</label>
                <select name="asset_class" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
                    {% for value, label in asset_classes %}
                    <option value="{{ value }}" {% if (asset.asset_class | string) == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Sector</label>
                <input type="text" name="sector" value="{{ asset.sector or '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border px-3 py-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">CUSIP</label>
            <input type="text" name="cusip" value="{{ asset.cusip or '' }}"
                   class="mt-1 block w-full max-w-xs rounded-md border-gray-300 shadow-sm border px-3 py-2 font-mono">
        </div>

        <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
            <input type="checkbox" name="is_publicly_traded" value="true" {% if asset.is_publicly_traded %}checked{% endif %} class="rounded border-gray-300">
            Publicly Traded (enables automatic price fetching)
        </label>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-blue-600 text-white rounded-md px-6 py-2 text-sm font-medium hover:bg-blue-700">Save Changes</button>
            <a href="/portfolio/assets" class="text-gray-600 rounded-md px-6 py-2 text-sm hover:text-gray-900">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
