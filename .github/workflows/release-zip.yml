# Builds the flat release zip and attaches it to the GitHub release.
# A release without family-office-<ver>.zip is invisible to zip installs'
# self-updater, so this runs whenever a release is published, and can be
# re-run by hand for an existing tag (Actions → Release zip → Run workflow).
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach (e.g. v0.1.27)"
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $VER"; exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build release zip
        run: python scripts/build_release.py

      - name: Attach zip to release
        run: gh release upload "$TAG" "dist/family-office-$VER.zip" --clobber -R "$GITHUB_REPOSITORY"
